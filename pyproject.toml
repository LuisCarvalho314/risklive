[project]
name = "risklive"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Your Name" }]
classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Developers",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
        "altair>=5.3.0",
        "APScheduler>=3.10.4",
        "beautifulsoup4>=4.12.3",
        "bertopic>=0.16.3",
        "Flask>=3.0.3",
        "httpx>=0.27.0",
        "matplotlib>=3.9.1",
        "nltk>=3.8.1",
        "numpy>=1.26.4",
        "openai>=1.36.1",
        "plotly==5.22.0",
        "pydantic>=2.8.2",
        "pydantic-settings>=2.4.0",
        "python-dotenv>=1.0.1",
        "PyYAML>=6.0.1",
        "requests>=2.32.3",
        "scikit-learn>=1.5.1",
        "scipy>=1.16.3",
        "seaborn>=0.13.2",
        "sentence-transformers>=3.0.1",
        "streamlit>=1.36.0",
        "torch>=2.3.1",
        "transformers>=4.42.4",
        "streamlit-analytics2",
        "valyu>=2.2.2",
        "pandas-stubs==2.3.2.250926",
        "pandas>=2.3.3",
        "notebook>=7.5.0",
        "ipywidgets>=8.1.8",
        "pytest>=9.0.2",
        "pydantic-ai[examples]>=1.47.0",
        "pydantic-ai-slim[web]>=1.47.0",
        "polars>=1.37.1",
        "python-docx>=1.2.0",
        "pydevd-pycharm>=261.17801.91",
]

[project.optional-dependencies]
dev = [
        "pytest",
        "pytest-cov",
        "flake8",
        "black",
        "mypy",
]

[project.scripts]
risklive = "app.cli:main"
risklive-server = "app.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
