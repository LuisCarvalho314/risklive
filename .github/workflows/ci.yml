name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'dev/**'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DISABLE_SCHEDULER: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.9.15'
      - name: Install locked Python dependencies, including the dev group
        run: uv sync --locked --group dev
      - name: Run isolated backend tests
        # Explicit files avoid operational task modules and tests that still
        # depend on runtime archives or checkout-relative side effects.
        # Coverage remains disabled while CI coverage is expanded incrementally.
        run: >-
          uv run --frozen --no-sync pytest --no-cov
          tests/unit/config/test_config.py
          tests/unit/config/test_settings_edges.py
          tests/unit/app/test_server_main.py
          tests/unit/models/test_models.py
          tests/unit/models/test_models_edges.py
          tests/unit/models/test_csv_dashboard_edges.py
          tests/unit/services/test_storage.py
          tests/unit/services/test_storage_backup.py
          tests/unit/services/test_storage_extra.py
          tests/unit/services/test_storage_and_server_edges.py
          tests/unit/utils/test_pricing.py
          tests/unit/utils/test_utils_rows.py
          tests/unit/utils/test_logging.py
          tests/unit/utils/test_logging_redaction_edges.py
          tests/unit/utils/test_runtime_edges.py
          tests/unit/services/test_seca_timeline.py
          tests/unit/app/test_server_process.py
          tests/unit/app/test_cli_branch_completion.py
          tests/unit/app/test_cli_more.py
          tests/unit/app/test_cli_server.py
          tests/unit/app/test_runtime_edges.py
          tests/unit/app/test_server_branch_completion.py
          tests/unit/app/test_server_error_handling.py
          tests/unit/app/test_server_scheduler.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Run frontend unit tests
        run: pnpm test
      - name: Build Next.js
        run: pnpm build
